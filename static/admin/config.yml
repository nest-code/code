backend:
  name: turbo-github
  # Ganti setelah site dibuat di dashboard Decap Turbo.
  turbo_site_id: YOUR_DECAP_TURBO_SITE_ID
  branch: main

site_url: https://YOUR-SITE.workers.dev
display_url: https://YOUR-SITE.workers.dev
locale: id
publish_mode: simple
media_folder: static/uploads
public_folder: /uploads

collections:
  - name: articles
    label: Artikel
    label_singular: Artikel
    folder: src/content/articles
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} — {{category}}"
    fields:
      - { label: Judul, name: title, widget: string }
      - { label: Tanggal, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD MMMM YYYY", time_format: false }
      - { label: Kategori, name: category, widget: select, options: [Catatan, Ide Sistem, Studi Kasus, Teknologi] }
      - { label: Ringkasan, name: excerpt, widget: text }
      - { label: Dipublikasikan, name: published, widget: boolean, default: false }
      - { label: Isi Artikel, name: body, widget: markdown }
